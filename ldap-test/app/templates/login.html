<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LDAP Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f8;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      width: min(380px, 90vw);
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 16px;
      font-size: 1.4rem;
    }
    label {
      display: block;
      margin-top: 12px;
      font-size: 0.95rem;
    }
    input {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #c8d1dc;
      border-radius: 6px;
    }
    button {
      margin-top: 16px;
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 10px;
      background: #0b5ed7;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .error {
      margin-top: 12px;
      color: #b30000;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sign in with LDAP</h1>

    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />

      <button type="submit">Sign in</button>
    </form>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
  </main>
</body>
</html>
