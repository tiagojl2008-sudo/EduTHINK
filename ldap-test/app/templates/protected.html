<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protected Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f8;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      width: min(640px, 92vw);
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    a {
      color: #0b5ed7;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Protected Placeholder Page</h1>
    <p>You are logged in as <strong>{{ username }}</strong>.</p>
    <p>This is where your private content can go.</p>
    <p><a href="/logout">Log out</a></p>
  </main>
</body>
</html>
