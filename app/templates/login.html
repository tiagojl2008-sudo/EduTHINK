{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; padding: 24px;">
  <div style="width: 100%; max-width: 400px;">
    <div style="text-align: center; margin-bottom: 36px;">
      <div style="width: 64px; height: 64px; background: #0066cc; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 16px;">📋</div>
      <h2 style="font-size: 28px; font-weight: 700;">Bem-vindo</h2>
      <p style="color: #666; margin-top: 6px;">Acesso restrito a utilizadores registados.</p>
    </div>
    <div class="card">
      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <div class="form-group">
          <label class="lbl">Username / Email</label>
          <input type="text" name="username" placeholder="email@exemplo.pt" required>
        </div>
        <div class="form-group">
          <label class="lbl">Palavra-passe</label>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 8px;" type="submit">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
