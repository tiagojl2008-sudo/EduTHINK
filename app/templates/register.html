{% extends "base.html" %}
{% block title %}Criar Conta{% endblock %}
{% block content %}
<div style="min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; padding: 24px;">
  <div style="width: 100%; max-width: 400px;">
    <div style="text-align: center; margin-bottom: 36px;">
      <div style="width: 64px; height: 64px; background: #0066cc; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 16px;">👤</div>
      <h2 style="font-size: 28px; font-weight: 700;">Criar Conta</h2>
      <p style="color: #666; margin-top: 6px;">Cria a tua conta para reservar salas.</p>
    </div>
    <div class="card">
      {% if error %}
        <div class="error-msg">⚠️ {{ error }}</div>
      {% endif %}
      <form method="post" action="/register">
        <div class="form-group">
          <label class="lbl">Nome / Nickname</label>
          <input type="text" name="name" placeholder="Ex: João Silva" required>
        </div>
        <div class="form-group">
          <label class="lbl">Email</label>
          <input type="email" name="email" placeholder="email@exemplo.pt" required>
        </div>
        <div class="form-group">
          <label class="lbl">Palavra-passe</label>
          <input type="password" name="password" placeholder="••••••••" minlength="6" required>
        </div>
        <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 8px;" type="submit">Criar Conta</button>
      </form>
    </div>
    <p style="text-align: center; color: #555; font-size: 12px; margin-top: 16px;">
      Já tens conta? <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: 600;">Fazer login</a>
    </p>
  </div>
</div>
{% endblock %}
